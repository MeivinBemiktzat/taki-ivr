name: בדיקות טאקי
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check api/game.js
          node --check api/ivr.js
          node --check api/storage.js
      - name: Unit tests
        run: npm test
